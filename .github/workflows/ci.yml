name: Build and smoke test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build backend
        run: |
          npm install --prefix backend
          npm run build --prefix backend
      - name: Test integrations, LAN snapshots and Network Detective history
        run: npm run test --prefix backend
      - name: Validate scanner shim syntax
        run: sh -n backend/docker/sudo
      - name: Install and build frontend
        run: |
          npm install --prefix frontend
          npm run build --prefix frontend
      - name: Smoke test Detective page rendering
        run: ./backend/node_modules/.bin/tsx --test frontend/test/detective-page.test.tsx
      - name: Smoke test notification page rendering
        run: ./backend/node_modules/.bin/tsx --test frontend/test/notifications-page.test.tsx
      - name: Smoke test API without Proxmox credentials
        env:
          DATABASE_PATH: ${{ runner.temp }}/homelab-smoke.sqlite
          PORT: '3199'
        run: |
          set -euo pipefail
          node backend/dist/index.js &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3199/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3199/api/health | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{if(JSON.parse(b).status!=='ok') process.exit(1)})"
          curl -fsS http://127.0.0.1:3199/api/integrations/proxmox | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{if(JSON.parse(b).state!=='disabled') process.exit(1)})"
          curl -fsS http://127.0.0.1:3199/api/systems | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{if(!Array.isArray(JSON.parse(b))) process.exit(1)})"
          curl -fsS http://127.0.0.1:3199/api/network/lan | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{const x=JSON.parse(b);if(x.state!=='missing'||!Array.isArray(x.results))process.exit(1)})"
          curl -fsS http://127.0.0.1:3199/api/network/detective/summary | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{const x=JSON.parse(b);if(x.scans!==0||x.totalDevices!==0||x.events!==0)process.exit(1)})"
          curl -fsS http://127.0.0.1:3199/api/network/devices | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{if(!Array.isArray(JSON.parse(b)))process.exit(1)})"
          curl -fsS http://127.0.0.1:3199/api/network/events | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{if(!Array.isArray(JSON.parse(b)))process.exit(1)})"
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3199/api/network/events?limit=10000')" = "400"
          curl -fsS http://127.0.0.1:3199/api/notifications/status | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{const x=JSON.parse(b);if(x.state!=='disabled'||x.enabled!==false||x.counts.accepted!==0)process.exit(1)})"
          curl -fsS http://127.0.0.1:3199/api/notifications/history | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{if(!Array.isArray(JSON.parse(b)))process.exit(1)})"
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3199/api/notifications/history?limit=1000')" = "400"
          curl -fsS http://127.0.0.1:3199/api/integrations/opnsense | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{const x=JSON.parse(b);if(x.state!=='disabled'||x.configured!==false||JSON.stringify(x).includes('api_key'))process.exit(1)})"
          # Outside Docker the scanner is disabled, so no scan executes in CI.
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3199/api/network/lan/scan)" = "503"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://another.example' http://127.0.0.1:3199/api/network/lan/scan)" = "403"
      - name: Build direct scanner Docker image
        run: docker compose build backend frontend
      - name: Verify non-root backend and bundled lanscan
        run: |
          docker compose run --rm --no-deps --entrypoint /bin/sh backend -c '
            test "$(id -un)" = node
            /opt/lanscan/bin/lanscan --version
            /usr/sbin/getcap "$(readlink -f /usr/local/bin/arp-scan)" | grep -q cap_net_raw
            test -x /usr/local/bin/sudo
          '
