services:
  backend:
    build: ./backend
    restart: unless-stopped
    # ARP broadcasts cannot reach the real LAN through Docker's bridge.
    # Only NET_RAW is added; Node still runs as the non-root 'node' user.
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3001}
      DATABASE_PATH: /app/data/homelab.sqlite
      LANSCAN_SNAPSHOT_FILE: /app/data/lanscan.json
      LANSCAN_NETWORK: ${LANSCAN_NETWORK:-192.168.1.0/24}
      LANSCAN_ENABLED: "true"
      LANSCAN_WITH_OPNSENSE: ${LANSCAN_WITH_OPNSENSE:-false}
      # Nonsecret OPNsense connection metadata; API credentials stay in Infisical.
      LANSCAN_OPNSENSE_URL: ${LANSCAN_OPNSENSE_URL:-}
      LANSCAN_OPNSENSE_API_KEY_REF: ${LANSCAN_OPNSENSE_API_KEY_REF:-OPNSENSE_API_KEY}
      LANSCAN_OPNSENSE_API_SECRET_REF: ${LANSCAN_OPNSENSE_API_SECRET_REF:-OPNSENSE_API_SECRET}
      LANSCAN_OPNSENSE_CA_PATH: ${LANSCAN_OPNSENSE_CA_PATH:-}
      # Sprint 3D: internal Pushover Proxy; NEVER direct Pushover credentials.
      NETWORK_NOTIFICATIONS_ENABLED: ${NETWORK_NOTIFICATIONS_ENABLED:-false}
      NETWORK_NOTIFICATIONS_PROXY_URL: ${NETWORK_NOTIFICATIONS_PROXY_URL:-http://api.ulnihnw.net/api/pushover/send}
      NETWORK_NOTIFICATIONS_EVENT_TYPES: ${NETWORK_NOTIFICATIONS_EVENT_TYPES:-NEW_DEVICE,IP_CONFLICT}
      NETWORK_NOTIFICATIONS_COOLDOWN_MINUTES: ${NETWORK_NOTIFICATIONS_COOLDOWN_MINUTES:-60}
      # Sprint 3E: independent LAN Discord Proxy channel, off until enabled.
      NETWORK_DISCORD_NOTIFICATIONS_ENABLED: ${NETWORK_DISCORD_NOTIFICATIONS_ENABLED:-false}
      NETWORK_DISCORD_NOTIFICATIONS_PROXY_URL: ${NETWORK_DISCORD_NOTIFICATIONS_PROXY_URL:-http://api.ulnihnw.net/api/discord/send}
      NETWORK_DISCORD_NOTIFICATIONS_EVENT_TYPES: ${NETWORK_DISCORD_NOTIFICATIONS_EVENT_TYPES:-NEW_DEVICE,IP_CONFLICT}
      NETWORK_DISCORD_NOTIFICATIONS_COOLDOWN_MINUTES: ${NETWORK_DISCORD_NOTIFICATIONS_COOLDOWN_MINUTES:-60}
      PROXMOX_INSTANCES_FILE: ${PROXMOX_INSTANCES_FILE:-}
      PROXMOX_URL: ${PROXMOX_URL:-}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      PROXMOX_CA_PATH: ${PROXMOX_CA_PATH:-}
      INFISICAL_SITE_URL: ${INFISICAL_SITE_URL:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_CLIENT_SECRET_FILE: ${INFISICAL_CLIENT_SECRET_FILE:-}
      NODE_EXTRA_CA_CERTS: ${INFISICAL_CA_PATH:-}
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => {if(!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3001}
    # Frontend remains bridged; proxy connections reach the host-network backend.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
